spring:
  application:
    name: eldercare

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eldercare}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # The schema predates Flyway, so an existing database is stamped as already
    # being at V1 rather than having V1 run against it. A brand-new database has
    # no tables, so V1 runs normally. Safe to leave on permanently.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway owns the schema now. Hibernate only checks the entities still match
      # what is actually there and refuses to start if they have drifted; it no
      # longer alters anything itself.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    # Keep the persistence context out of the view layer so lazy loads fail loudly
    # in the service tier instead of silently issuing queries during serialization.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    # Serialize Instants as ISO-8601 strings, which mobile clients parse natively.
    serialization:
      write-dates-as-timestamps: false

app:
  # Seeds the first admin on startup if this account does not exist yet.
  # Leave unset in environments that already have an admin.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  jwt:
    # Base64-encoded, at least 256 bits of randomness. No default on purpose:
    # the app must fail to start rather than run on a guessable signing key.
    # Generate one with:  openssl rand -base64 48
    secret: ${JWT_SECRET}
    # 24 hours.
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    # AppConfig builds its own DaoAuthenticationProvider so it can set the password
    # encoder explicitly. Spring then warns that auto-configuration will not wire the
    # UserDetailsService bean itself — which is the intended arrangement here, since
    # the provider is handed CustomUserDetailsService directly. Silence the notice.
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": error

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
