spring:
  application:
    name: eldercare

  datasource:
    # Either a full DB_URL, or the parts separately - hosting platforms hand out
    # host/port/name/user/password, not a JDBC URL.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eldercare}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # The schema predates Flyway, so an existing database is stamped as already
    # being at V1 rather than having V1 run against it. A brand-new database has
    # no tables, so V1 runs normally. Safe to leave on permanently.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # Flyway owns the schema now. Hibernate only checks the entities still match
      # what is actually there and refuses to start if they have drifted; it no
      # longer alters anything itself.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    # Keep the persistence context out of the view layer so lazy loads fail loudly
    # in the service tier instead of silently issuing queries during serialization.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    # Serialize Instants as ISO-8601 strings, which mobile clients parse natively.
    serialization:
      write-dates-as-timestamps: false

app:
  # Seeds the first admin on startup if this account does not exist yet.
  # Leave unset in environments that already have an admin.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

  jwt:
    # Base64-encoded, at least 256 bits of randomness. No default on purpose:
    # the app must fail to start rather than run on a guessable signing key.
    # Generate one with:  openssl rand -base64 48
    secret: ${JWT_SECRET}
    # 24 hours.
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    # Comma-separated. Only browsers send an Origin, so this governs the website alone;
    # the Android app is unaffected. In production: https://app.yourdomain.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://localhost:8082}

  rate-limit:
    # Login + signup attempts per client address per minute.
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}

server:
  port: ${PORT:${SERVER_PORT:8081}}
  # Hosting platforms terminate HTTPS at a proxy and pass the client address in
  # X-Forwarded-For. "native" lets Tomcat trust that header only from a private-network
  # hop, so the login rate limit sees the real client and cannot be spoofed around.
  forward-headers-strategy: native

logging:
  level:
    # AppConfig builds its own DaoAuthenticationProvider so it can set the password
    # encoder explicitly. Spring then warns that auto-configuration will not wire the
    # UserDetailsService bean itself — which is the intended arrangement here, since
    # the provider is handed CustomUserDetailsService directly. Silence the notice.
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer]": error

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
