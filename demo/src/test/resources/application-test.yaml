# Test-only configuration: in-memory H2, throwaway signing key.
# Nothing here is used by a running application.
spring:
  datasource:
    url: jdbc:h2:mem:eldercare;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # The migrations are PostgreSQL-specific, so tests keep letting Hibernate build
  # the schema in H2 rather than running them. That keeps tests fast and portable,
  # at the cost of not exercising the migrations themselves - those are verified
  # against a real PostgreSQL instead.
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  admin:
    email: admin@test.local
    password: admin-test-password

  jwt:
    secret: 0DfwmpOCRtOGXPEzD0h5oyLDMGkNDd35Jm0CzJfAcrosgoES6o6VUhWtTh63ec3H
    expiration-ms: 3600000
